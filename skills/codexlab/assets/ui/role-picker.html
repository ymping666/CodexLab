  <section class="lab" aria-label="研究团队配置">
    <div class="top"><span class="brand">CodexLab</span><span class="tag">你的 Codex 原生研究团队</span></div>
    <ol class="steps" aria-label="配置流程"><li data-step="start">1 · 选择用途</li><li data-step="team">2 · 核对团队</li><li data-step="chat">3 · 交回聊天</li></ol>
    <section class="start-view">
      <h2>你现在想做什么？</h2>
      <p class="intro">先选最接近的用途。我们配好起点，你不用先记住研究员名字。</p>
      <div class="goals" role="group" aria-label="选择研究用途"></div>
      <div class="start-footer"><span class="secondary start-hint">先选择一项用途</span><button type="button" class="action primary next cursor-interaction">下一步：查看团队</button></div>
      <button type="button" class="quiet custom-start cursor-interaction">我熟悉角色，直接自选 →</button>
      <p class="scope">这里只配置团队，不会开始检索、实验或研究。</p>
    </section>
    <section class="team-view" hidden>
      <h2>看看你的团队</h2>
      <p class="draft-note"></p><p class="reason"></p>
      <div class="team" aria-label="当前团队与调整入口"></div>
      <div class="team-note"><p class="team-size secondary"></p><p class="tradeoff secondary"></p><p class="review-note secondary"></p></div>
      <div class="footer"><button type="button" class="quiet back-start cursor-interaction">← 重新选择用途</button><div class="footer-actions"><button type="button" class="action primary confirm cursor-interaction">确认团队并回到聊天</button></div></div>
      <p class="scope">确认只配置团队。之后在聊天里说明题目和任务范围，才开始工作。</p>
      <p class="status" aria-live="polite">候选团队尚未确认。</p>
      <details class="command"><summary class="cursor-interaction">查看或手动复制配置指令</summary><label for="codexlab-team-prompt" class="secondary">将完整指令发送到聊天确认</label><textarea id="codexlab-team-prompt" class="prompt" readonly rows="3" spellcheck="false"></textarea><button type="button" class="action copy cursor-interaction">复制配置指令</button></details>
      <details class="advanced"><summary class="cursor-interaction">换一套场景组合（可选）</summary><div class="presets" role="group" aria-label="场景推荐组合"></div><div class="preset-detail"><span class="preset-label"></span><p class="preset-when secondary"></p><p class="preset-tradeoff secondary"></p></div></details>
    </section>
    <section class="edit-view" hidden>
      <h2>调整这一位研究员</h2>

      <label for="codexlab-category-select" class="category-label">正在调整的职责</label><select id="codexlab-category-select" class="category-select"></select>
      <section id="codexlab-style-panel" aria-label="职责风格选择"><div class="panel-heading"><div><h3 class="panel-title"></h3><p class="panel-note secondary"></p></div><button type="button" class="action disable-role cursor-interaction">暂不启用此职责</button></div><div class="profiles" role="group" aria-label="选择一种工作风格"></div><div class="profile-detail"></div></section>
      <div class="footer"><span class="secondary">选择只修改当前职责</span><button type="button" class="action primary back-team cursor-interaction">完成调整，返回团队</button></div>
    </section>
  </section>
  <script id="codexlab-style-catalog" type="application/json">{"schema_version":2,"categories":[{"id":"pi","label":"研究负责人","required":true,"default":"Aster","profiles":[{"name":"Aster","style":"综合统筹","summary":"在问题、资源、分工和证据之间保持一致，整合各角色的分歧。","deliverable":"研究简报、职责分配、证据支持的综合结论与决策记录。","instructions":["将当前目标拆成依赖顺序和独立任务，给每个任务分配输入、独占写入路径和资源上限。","整合交接时对照原始材料，分别记录一致意见、冲突证据、缺失项和需要人的决定。","在每个阶段决定继续、返工或停止，并把理由、相关证据编号和预算状态写入决策记录。"],"watch_out":"综合协调可能增加交接成本；不能用多数意见替代原始证据，也不能把 PI 自查称为独立审查。"},{"name":"Orion","style":"探索驱动","summary":"先比较少量可检验方向，再决定值得收敛到哪一个问题。","deliverable":"候选问题比较、优先探索顺序、淘汰理由与范围决策。","instructions":["在已有授权范围内列出少量候选问题，对每个问题标明可用证据、关键未知和最低资源需求。","为每个候选设一个能尽早暴露不可行性的检查和停止条件，不自动启动并行实验。","按已获得的证据与预算比较候选，保留淘汰理由，在扩大投入前请求必要的人类选择。"],"watch_out":"探索容易分散预算；检索线索和可行性判断不能直接升级为新颖性或效果结论。"},{"name":"Quinn","style":"决策收敛","summary":"尽早明确关键选择和停止规则，减少没有决策价值的工作。","deliverable":"优先级、决策依据、冻结的范围与明确的下一步。","instructions":["将当前阻塞转为明确的决策项，列出备选、现有证据、仍缺的信息和由谁决定。","只优先安排能改变关键决策的任务，给它们设最大时间或运行数以及返回要求。","记录选择、拒绝的选项和重新打开决策的条件；遇到反证时允许修订并保留历史。"],"watch_out":"过早收敛可能错失替代解释；不能为赶进度跳过必要文献、对照或独立审查。"}]},{"id":"literature","label":"文献科学家","required":false,"default":"Atlas","profiles":[{"name":"Atlas","style":"系统综述","summary":"按明确范围梳理近邻方法，建立可追溯的主张与来源关系。","deliverable":"有检索边界的文献地图、近邻比较表和来源证据账本。","instructions":["先记录问题范围、检索式、日期、纳入标准和不可访问来源，再执行授权的检索。","打开原始来源后按问题、假设、方法和评测比较近邻工作，标注仅摘要可见的限制。","将支持和冲突证据连接到具体主张与来源位置，并列出仍未覆盖的检索盲区。"],"watch_out":"系统梳理可能耗时；有限检索不是完整文献穷尽，也不能由搜索未命中证明创新。"},{"name":"Scout","style":"前沿雷达","summary":"在明确的近期窗口内发现新线索，再精读最接近的工作。","deliverable":"近期候选清单、值得精读的近邻及带访问限制的证据记录。","instructions":["明确近期时间窗口和主题关键词，在授权来源中检索新论文、官方实现及更新记录。","把发现线索与已打开核验的证据分开，优先精读最可能改变研究判断的近邻。","对候选核对版本、日期和实际支持的主张，补查可能被近期窗口遗漏的奠基工作。"],"watch_out":"近期热度不等于可靠性或相关性；不能忽略较早近邻，也不能把预印本结果视为既定事实。"},{"name":"Flint","style":"反证检索","summary":"主动寻找创新碰撞、反例和不支持主要假设的证据。","deliverable":"主张碰撞清单、反证位置、替代解释与仍可成立的边界。","instructions":["把拟议贡献逐项改写为可被先前工作或反例推翻的命题，形成针对性的检索查询。","打开最强碰撞候选，逐项比较问题、假设、机制和评测条件，避免只看标题判定重合。","同时记录成立与不成立的反证、访问限制及剩余差异，将确实被推翻的贡献交回 PI。"],"watch_out":"反证导向也会产生选择偏差；相似术语不等于方法重合，单个反例不能否定超出其条件的所有主张。"}]},{"id":"method","label":"方法科学家","required":false,"default":"Nova","profiles":[{"name":"Nova","style":"机制驱动","summary":"从可检验的机制解释出发，连接算法组件和失败条件。","deliverable":"机制假设、实现伪代码、关键对照和可证伪的方法方案。","instructions":["基于已核验近邻写明一个机制假设，区分观察、解释和尚待验证的因果联系。","为假设给出输入输出、伪代码、关键组件与资源需求，将每个组件连接到可检验的预测。","指定能区分竞争解释的对照或消融及失败判据，在最终测试前冻结主要主张与协议。"],"watch_out":"合理的机制叙事不是证据；不能由整体指标提升推断每个组件或机制都成立。"},{"name":"Theo","style":"理论约束","summary":"明确假设和适用条件，用理论边界约束实现与主张。","deliverable":"假设清单、可检查的推导或界限、适用条件与实证检验要求。","instructions":["将拟议方法的假设、变量和目标形式化，列出实际任务可能违反的条件。","逐步检查可成立的推导或边界，给出必要条件、未证明步骤和反例，而不编造定理保证。","把理论条件转成实现检查和可观察的失败情形，规定哪些结论仍须由实际实验验证。"],"watch_out":"简化假设可能远离真实任务；推导正确也不证明经验有效，未完成证明必须保持未证明。"},{"name":"Mira","style":"极简实证","summary":"保留最少的方法组件，以清楚的比较检验一个狭窄主张。","deliverable":"最小可实现方案、必要对照、少量关键消融与清楚的主张边界。","instructions":["选择一个预算内可证伪的狭窄主张，删去没有独立检验目的的组件和可调参数。","保留与该主张直接相关的强对照和共同协议，说明省略其他比较的边界与理由。","给出最小实现、主要指标和失败条件，将探索性修改与冻结后的确认性检验分开。"],"watch_out":"简化不能等于弱对照或不足证据；小范围结论不能外推成通用方法优势。"}]},{"id":"experiment","label":"实验科学家","required":false,"default":"Forge","profiles":[{"name":"Forge","style":"工程复现","summary":"把已约定方案落实为可执行、可追溯且可复现的运行。","deliverable":"实验计划、授权实现、完整命令环境与原始运行记录。","instructions":["在运行前核对数据许可与身份、代码版本、环境、输入输出以及既定资源上限。","按冻结协议执行授权任务，保存实际命令、种子、原始输出、失败日志和偏离记录。","从原始记录计算汇总，给出可重跑步骤与缺失依赖，区分计划、尝试、成功和失败。"],"watch_out":"工程可复现不等于比较公平或科学有效；不能为让流程跑通而静默改变数据、指标或协议。"},{"name":"Vector","style":"统计稳健","summary":"围绕独立单位、重复和不确定性保持测量与解释一致。","deliverable":"测量协议、配对比较与不确定性汇总、全部运行和排除记录。","instructions":["先明确独立样本单位、配对关系、主要指标和预算内重复方案，避免把相关记录当作独立重复。","保持共同数据、拆分、调参和计算规则，保存所有计划种子、失败、缺失与预先约定的排除理由。","从原始测量报告效应与适合独立单位的不确定性，标注不足的重复或精度，不把单次波动写成稳健结论。"],"watch_out":"统计汇总依赖设计与假设；更多重复不能修复数据泄漏、偏置样本或不公平 baseline。"},{"name":"Pulse","style":"小步验证","summary":"用有停止规则的小规模检查暴露问题，再决定是否扩大投入。","deliverable":"分步检查计划、小规模原始记录、继续或停止的依据。","instructions":["把当前主要风险拆成预算内的小检查，为每一步列出输入、关键因素、最大运行数和停止规则。","先验证数据流与实现是否满足前提，逐步保存真实输出；无数据或权限时只返回准备清单。","每步依据实际记录建议继续、返工或停止，扩大到最终评测前另行冻结协议并记录探索性改动。"],"watch_out":"小规模探索可能高噪声或不具代表性；不能反复看测试结果调参，也不能将试跑当成最终结论。"}]},{"id":"reviewer","label":"独立审查员","required":false,"default":"Sage","profiles":[{"name":"Sage","style":"综合审查","summary":"独立检查主张、来源、比较和复现是否形成完整证据链。","deliverable":"有证据位置的审查发现、修正要求与明确的有限结论。","instructions":["在独立于作者的任务上下文中读取原始来源、实现、运行和协议变更，逐项核对主要主张。","审查近邻碰撞、baseline 公平性、泄漏、选择性报告和不确定性，指出具体证据位置与影响。","在已授权预算内尝试必要复现，区分尝试与完成，并给出 revise、stop 或 ready-for-human-review 的理由。"],"watch_out":"覆盖面广不保证每项都被充分验证；必须列出未检查项，不能把综合印象当成独立证据。"},{"name":"Rook","style":"对抗挑错","summary":"优先挑战最强主张，寻找能改变结论的薄弱环节。","deliverable":"高影响反例、严重性分级、作者可执行的修正请求。","instructions":["从最重要的结论反向追踪证据，列出可能推翻结论的替代解释、遗漏对照和边界条件。","在独立任务上下文和原预算内检查这些风险，引用真实来源或原始运行，避免只提出抽象怀疑。","按对主张的实际影响排序发现，区分已证实缺陷、待核验风险和不影响结论的小问题。"],"watch_out":"对抗风格不能等于默认否定；没有证据的质疑不能包装成已确认缺陷，措辞须可核验且建设性。"},{"name":"Trace","style":"复现审计","summary":"独立沿命令、环境、数据与原始记录追踪可复现性。","deliverable":"复现路径、实际尝试记录、缺失依赖和结果一致性审计。","instructions":["在独立任务上下文中从记录重建代码、数据、环境与精确命令，检查原始输出能否支撑汇总。","只在明确授权资源和预算内尝试重跑，保留实际日志并比较复现结果与作者记录。","分别报告记录核查、执行尝试、完成复现和无法复现的具体原因，将结论限制在已检查的部分。"],"watch_out":"重跑一致不证明新颖性、外部有效性或统计合理性；无法执行时不能声称已经完成复现。"}]}],"entry_points":[{"id":"explore","title":"读论文，找研究方向","summary":"还没确定题目，先梳理相关工作和可检验的问题","selection":{"pi":"Orion","literature":"Atlas","method":"Nova","experiment":null,"reviewer":null},"reason":"先保留文献与方法职责，实验和审查需要时再加","tradeoff":"适合前期探索；形成正式结论前仍需补齐实验与独立审查"},{"id":"idea","title":"打磨一个研究想法","summary":"已有想法，想查重合、缩小主张并找出薄弱点","selection":{"pi":"Quinn","literature":"Flint","method":"Mira","experiment":null,"reviewer":"Rook"},"reason":"先查近邻与反证，再用最小方案检验一个狭窄主张","tradeoff":"先做纸面准备，不自动获得创新结论或实验效果"},{"id":"experiment","title":"设计或推进实验","summary":"已有方向或方案，需要比较设计、实现和运行记录","selection":{"pi":"Aster","literature":"Atlas","method":"Nova","experiment":"Forge","reviewer":"Sage"},"reason":"覆盖文献、方法、执行和审查；按实际任务分阶段调用","tradeoff":"完整团队交接成本更高；运行前仍需明确数据、权限和预算"},{"id":"reproduce","title":"检查结果或复现问题","summary":"已有代码、结果或失败记录，先定位证据与复现缺口","selection":{"pi":"Aster","literature":"Flint","method":"Mira","experiment":"Forge","reviewer":"Trace"},"reason":"优先核对近邻、实现和原始运行，独立追踪复现链","tradeoff":"复现一致不等于方法新颖，也不保证对其他任务有效"}],"presets":[{"id":"balanced","label":"均衡推进","when":"已有初步研究方向，需要覆盖文献、方法、执行和审查的交接；这是设计建议，不是实测最优。","tradeoff":"职责覆盖较全，但协调和交接成本较高；按依赖分阶段运行，不同时启动所有角色。","selection":{"pi":"Aster","literature":"Atlas","method":"Nova","experiment":"Forge","reviewer":"Sage"}},{"id":"frontier","label":"前沿探索","when":"问题尚未收敛，需要快速检查近期线索和可行性风险；这是设计建议，不是实测最优。","tradeoff":"近期线索与小步检查便于探索，但易漏掉较早近邻且结果可能高噪声；扩大投入前补齐证据。","selection":{"pi":"Orion","literature":"Scout","method":"Nova","experiment":"Pulse","reviewer":"Rook"}},{"id":"lean","label":"有限预算","when":"题目可缩小，时间或计算预算有限，优先验证一个狭窄主张；这是设计建议，不是实测最优。","tradeoff":"减少组件和探索规模以控制成本，但降低覆盖范围；不能省略与主张直接相关的强对照和独立审查。","selection":{"pi":"Quinn","literature":"Atlas","method":"Mira","experiment":"Pulse","reviewer":"Sage"}},{"id":"rigorous","label":"严谨验证","when":"主要问题和资源已明确，需要检查理论条件、测量设计与复现链；这是设计建议，不是实测最优。","tradeoff":"更关注条件、重复和记录完整性，准备与审计成本较高；不能自动宣称严格证明或稳健有效。","selection":{"pi":"Quinn","literature":"Atlas","method":"Theo","experiment":"Vector","reviewer":"Trace"}},{"id":"reproduce","label":"复现诊断","when":"已有方法、实现或失败记录，需要定位可复现性问题与主张碰撞；这是设计建议，不是实测最优。","tradeoff":"聚焦近邻反证与运行链，适合诊断既有材料，但不会自动产出新方法或完整领域综述。","selection":{"pi":"Aster","literature":"Flint","method":"Mira","experiment":"Forge","reviewer":"Trace"}}]}</script>
  <script id="codexlab-picker-options" type="application/json">{"selection":null,"ignoreSavedState":false}</script>
  <script>
    (() => {
      const root = document.getElementById('codexlab-role-picker');
      const catalog = JSON.parse(root.querySelector('#codexlab-style-catalog').textContent);
      const options = JSON.parse(root.querySelector('#codexlab-picker-options').textContent);
      const ids = ['pi','literature','method','experiment','reviewer'];
      const labels = {pi:'PI',literature:'文献',method:'方法',experiment:'实验',reviewer:'审查'};
      const roleHelp = {pi:'统筹目标与分工，当前会话承担',literature:'查证相关工作与研究空白',method:'把想法变成可检验的方案',experiment:'执行有预算、有记录的实验',reviewer:'独立核对结论与原始证据'};
      const categories = new Map((catalog.categories || []).map(item => [item.id,item]));
      const presets = catalog.presets || []; const goals = catalog.entry_points || [];
      const status = root.querySelector('.status'), prompt = root.querySelector('.prompt'), confirm = root.querySelector('.confirm'), copy = root.querySelector('.copy'), disable = root.querySelector('.disable-role');
      if (catalog.schema_version !== 2 || ids.some(id => !categories.has(id) || !categories.get(id).profiles.length) || !goals.length) { root.querySelector('.intro').textContent = '目录不可用，请重新准备完整选择器。'; root.querySelector('.next').disabled = true; return; }
      const baseline = {pi:categories.get('pi').default,literature:categories.get('literature').default,method:categories.get('method').default,experiment:null,reviewer:null};
      function validSelection(value) { return value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === ids.length && ids.every(id => Object.prototype.hasOwnProperty.call(value,id) && (value[id] === null ? id !== 'pi' : categories.get(id).profiles.some(profile => profile.name === value[id]))); }
      const explicit = validSelection(options.selection);
      const state = {selection:explicit ? {...options.selection} : {...baseline},category:'pi',view:explicit ? 'team' : 'start',goal:null,pending:false,sent:null,restored:false,clipboardFailed:false};
      let localDraftTouched = false, selectionChanged = false;
      function bridge() { return window.openai && typeof window.openai.sendFollowUpMessage === 'function' ? window.openai : null; }
      function manualCopy() { return state.clipboardFailed || !navigator.clipboard || typeof navigator.clipboard.writeText !== 'function'; }
      function element(tag,className,text) { const node=document.createElement(tag); node.className=className; node.textContent=String(text || ''); return node; }
      function button(className,text) { const node=element('button',className+' cursor-interaction',text); node.type='button'; return node; }
      function configurationPrompt() { return '$codexlab 团队配置：'+ids.map(id=>labels[id]+'='+(state.selection[id] || '不启用')).join('；')+'。先只配置团队，不开始研究。'; }
      function sameSelection(left,right) { return ids.every(id=>left[id]===right[id]); }
      function resizePrompt() { if (!prompt.getClientRects().length) return; prompt.style.height='auto'; prompt.style.height=Math.max(80,prompt.scrollHeight+2)+'px'; }
      function save() {
        if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
        try { Promise.resolve(window.openai.setWidgetState({modelContent:{prototype:'CodexLab v2',schemaVersion:2,selection:{...state.selection},scope:'team-configuration-only'},privateContent:{category:state.category,view:state.view,goal:state.goal}})).catch(()=>{}); } catch (_) { /* Draft persistence is optional. */ }
      }
      function navigate(view) { if (state.pending) return; localDraftTouched=true; state.view=view; render(); }
      function changed() { localDraftTouched=true; selectionChanged=true; state.sent=null; state.restored=false; status.textContent='候选团队尚未确认。'; render(); save(); }
      function render() {
        root.querySelector('.start-view').hidden=state.view!=='start'; root.querySelector('.team-view').hidden=state.view!=='team'; root.querySelector('.edit-view').hidden=state.view!=='edit';
        root.querySelectorAll('[data-step]').forEach(node=>{ if (node.dataset.step===(state.sent ? 'chat' : state.view==='start' ? 'start' : 'team')) node.setAttribute('aria-current','step'); else node.removeAttribute('aria-current'); });
        root.querySelectorAll('[data-goal]').forEach(node=>node.setAttribute('aria-pressed',String(node.dataset.goal===state.goal)));
        root.querySelector('.next').disabled=!state.goal || state.pending; root.querySelector('.start-hint').textContent=state.goal ? '已选用途，可以查看推荐起点' : '先选择一项用途';
        const goal=goals.find(item=>item.id===state.goal), preset=presets.find(item=>sameSelection(item.selection,state.selection));
        root.querySelector('.draft-note').textContent=explicit && !selectionChanged ? '当前已确认的团队 · 可按需要调整' : state.restored ? '上次保存的候选团队 · 还未确认' : '候选团队 · '+(goal ? goal.title : '自定义配置');
        const originalGoal = goal && sameSelection(goal.selection,state.selection);
        root.querySelector('.reason').textContent=originalGoal ? goal.reason : preset ? preset.when : '已按你的选择调整配置。对某位不满意，点右侧调整即可。';
        root.querySelector('.tradeoff').textContent='取舍：'+(originalGoal ? goal.tradeoff : preset ? preset.tradeoff : '只启用当前任务需要的职责，缺失证据仍需补齐。');
        root.querySelector('.team-size').textContent='当前 '+ids.filter(id=>state.selection[id]!==null).length+' 个角色 · 负责人占当前会话，最多四个专门职责';
        root.querySelector('.review-note').textContent=state.selection.reviewer ? '审查员已配置；是否开始审查由后续任务决定。' : '暂未配置审查员；后续正式结论仍需独立审查。';
        const team=root.querySelector('.team'); team.replaceChildren();
        ids.forEach(id=>{
          const row=element('div','team-row',''); row.dataset.slot=id;
          const role=element('div','role-label',''); role.append(element('p','role-name',categories.get(id).label),element('p','role-help secondary',roleHelp[id]));
          const profile=categories.get(id).profiles.find(item=>item.name===state.selection[id]);
          const value=element('div','profile-value',''); value.append(element('span','chosen-name',profile ? profile.name : '暂不启用'),element('span','secondary',profile ? profile.style : '需要时再加入'));
          const edit=button('row-edit',profile ? '调整' : '添加'); edit.dataset.edit=id; edit.setAttribute('aria-label',(profile ? '调整' : '添加')+categories.get(id).label); edit.disabled=state.pending;
          edit.addEventListener('click',()=>{state.category=id;navigate('edit');}); row.append(role,value,edit); team.append(row);
        });
        root.querySelector('.category-select').value=state.category;
        const category=categories.get(state.category); root.querySelector('.panel-title').textContent=category.label;
        root.querySelector('.panel-note').textContent=category.required ? '负责人由当前会话承担，只调整带队风格' : '每个职责最多选一种风格，也可以暂不启用';
        disable.hidden=category.required; disable.disabled=state.pending; disable.setAttribute('aria-pressed',String(state.selection[category.id]===null));
        const profiles=root.querySelector('.profiles'); profiles.replaceChildren();
        category.profiles.forEach(profile=>{
          const choice=button('profile',''); choice.dataset.profile=profile.name; choice.disabled=state.pending; choice.setAttribute('aria-pressed',String(state.selection[category.id]===profile.name));
          const top=element('span','profile-top',''); const mark=element('span','mark','✓'); mark.setAttribute('aria-hidden','true'); top.append(element('span','name',profile.name),element('span','secondary',profile.style),mark);
          choice.append(top,element('span','summary',profile.summary)); choice.addEventListener('click',()=>{if(state.pending)return;state.selection[category.id]=profile.name;changed();}); profiles.append(choice);
        });
        const detail=root.querySelector('.profile-detail'); detail.replaceChildren(); const profile=category.profiles.find(item=>item.name===state.selection[category.id]);
        if(profile) detail.append(element('p','secondary','已选 '+profile.name+' · 交付：'+profile.deliverable),element('p','secondary','留意：'+(Array.isArray(profile.watch_out) ? profile.watch_out.join('；') : profile.watch_out)));
        root.querySelectorAll('[data-preset]').forEach(node=>{node.setAttribute('aria-pressed',String(Boolean(preset && preset.id===node.dataset.preset)));node.disabled=state.pending;});
        root.querySelector('.preset-label').textContent=preset ? preset.label : '自定义组合'; root.querySelector('.preset-when').textContent=preset ? '适用：'+preset.when : '可保留当前配置，也可换整套组合。'; root.querySelector('.preset-tradeoff').textContent=preset ? '取舍：'+preset.tradeoff : '换组合会替换所有职责；逐位调整只影响对应成员。';
        prompt.value=configurationPrompt(); resizePrompt();
        confirm.textContent=state.pending ? '正在交回聊天…' : bridge() ? state.sent===prompt.value ? '已交回聊天' : '确认团队并回到聊天' : manualCopy() ? '选中指令，手动复制' : '复制配置指令';
        copy.textContent=manualCopy() ? '选中完整指令' : '复制配置指令';
        confirm.disabled=state.pending || (Boolean(bridge()) && state.sent===prompt.value); copy.disabled=state.pending;
        root.querySelectorAll('.back-start,.back-team,.custom-start,.category-select').forEach(node=>node.disabled=state.pending);
      }
      function applySaved(saved,privateContent) {
        if(options.ignoreSavedState || localDraftTouched || !saved || saved.prototype!=='CodexLab v2' || saved.scope!=='team-configuration-only')return false;
        if(saved.schemaVersion===2 && validSelection(saved.selection))state.selection={...saved.selection};
        else if((saved.schemaVersion===undefined || saved.schemaVersion===1) && Array.isArray(saved.selected)){
          state.selection={pi:categories.get('pi').default,literature:null,method:null,experiment:null,reviewer:null}; ids.forEach(id=>{const profile=categories.get(id).profiles.find(item=>['Aster','Atlas','Nova','Forge','Sage'].includes(item.name) && saved.selected.includes(item.name));if(profile)state.selection[id]=profile.name;});
        }else return false;
        state.restored=true;state.view='team';state.goal=null;
        if(privateContent){if(categories.has(privateContent.category))state.category=privateContent.category;if(goals.some(item=>item.id===privateContent.goal))state.goal=privateContent.goal;if(['start','team','edit'].includes(privateContent.view))state.view=privateContent.view;}
        return true;
      }
      goals.forEach(goal=>{if(!validSelection(goal.selection))return;const choice=button('goal','');choice.dataset.goal=goal.id;choice.setAttribute('aria-pressed','false');const mark=element('span','radio-mark','');mark.setAttribute('aria-hidden','true');const content=element('span','goal-copy','');content.append(element('span','goal-title',goal.title),element('span','secondary',goal.summary));choice.append(mark,content);choice.addEventListener('click',()=>{if(state.pending || state.goal===goal.id)return;state.goal=goal.id;state.selection={...goal.selection};changed();});root.querySelector('.goals').append(choice);});
      categories.forEach(category=>{const option=element('option','',category.label);option.value=category.id;root.querySelector('.category-select').append(option);});
      presets.forEach(preset=>{const choice=button('preset',preset.label);choice.dataset.preset=preset.id;choice.addEventListener('click',()=>{if(state.pending)return;state.selection={...preset.selection};state.goal=null;changed();});root.querySelector('.presets').append(choice);});
      root.querySelector('.next').addEventListener('click',()=>{if(!state.goal || state.pending)return;navigate('team');save();});
      root.querySelector('.custom-start').addEventListener('click',()=>{localDraftTouched=true;state.goal=null;state.category='pi';navigate('edit');save();});
      root.querySelector('.back-start').addEventListener('click',()=>navigate('start')); root.querySelector('.back-team').addEventListener('click',()=>{navigate('team');save();});
      root.querySelector('.category-select').addEventListener('change',event=>{state.category=event.target.value;render();});
      disable.addEventListener('click',()=>{if(state.pending || categories.get(state.category).required)return;state.selection[state.category]=null;changed();});
      function selectPrompt(){root.querySelector('.command').open=true;resizePrompt();prompt.focus();prompt.select();}
      async function copyPrompt(){localDraftTouched=true;const instruction=configurationPrompt();try{if(manualCopy())throw Error('No clipboard bridge');await navigator.clipboard.writeText(instruction);status.textContent='已复制。粘贴到聊天并发送后，才会确认配置。';}catch(_){state.clipboardFailed=true;render();selectPrompt();status.textContent='完整指令已选中。复制后粘贴到聊天发送，才会确认配置。';}}
      copy.addEventListener('click',()=>{if(!state.pending)copyPrompt();});
      confirm.addEventListener('click',async()=>{
        if(state.pending || state.sent===prompt.value)return;
        const host=bridge();if(!host){await copyPrompt();return;}
        const instruction=configurationPrompt();localDraftTouched=true;state.pending=true;render();status.textContent='正在交回聊天，仅配置团队。';
        try{await host.sendFollowUpMessage({prompt:instruction,title:'确认研究团队 · 仅配置'});state.sent=instruction;status.textContent='配置请求已交回聊天，以聊天回复为准。接下来可在聊天说明题目和任务范围。';}
        catch(_){selectPrompt();status.textContent='未完成交回聊天。可手动重试，或复制完整指令后发送。';}
        finally{state.pending=false;render();}
      });
      const saved=window.openai && window.openai.widgetState;applySaved(saved && saved.modelContent,saved && saved.privateContent);render();
      root.querySelector('.command').addEventListener('toggle',resizePrompt);
      if(typeof ResizeObserver==='function'){let width=0;new ResizeObserver(entries=>{const next=entries[0].contentRect.width;if(next!==width){width=next;resizePrompt();}}).observe(prompt);}else window.addEventListener('resize',resizePrompt);
      window.addEventListener('openai:set_globals',event=>{if(state.pending || localDraftTouched)return;const saved=event.detail && event.detail.globals && event.detail.globals.widgetState;if(saved && applySaved(saved.modelContent,saved.privateContent))render();});
    })();
  </script>
</div>
